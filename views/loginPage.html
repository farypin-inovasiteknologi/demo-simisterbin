<div class="bg-shadow shadow1"></div>
<div class="bg-shadow shadow2"></div>

<div class="login-card animate__animated animate__zoomIn" id="viewLanding">
    <div class="text-center mb-4">
        <div class="d-flex justify-content-center gap-3 mb-3">
            <img id="landingLogoInstansi" class="floating-logo hidden">
            <img id="landingLogoSekolah" class="floating-logo hidden" style="animation-delay: 0.5s;">
        </div>
        <h6 class="text-uppercase fw-bold text-secondary mb-0 small" id="lblInstansiLanding">PEMERINTAH...</h6>
        <h5 class="text-uppercase fw-bold text-dark mb-4" id="lblSekolahLanding">NAMA SEKOLAH</h5>

        <img src="./icon.png" style="height: 80px;" class="mb-2">
        <h4 class="fw-bold text-primary mb-1">SiMISTerBIn</h4>
        <span class="text-muted small d-block mb-3">Sistem Buku Induk Siswa Digital</span>
        <div class="mb-4">
            <span
                class="badge bg-danger bg-opacity-10 text-danger border border-danger rounded-pill px-3 py-2 shadow-sm"
                style="letter-spacing: 1px; font-size: 0.75rem;">
                <i class="bi bi-cloud-sync-fill me-1"></i> HYBRID Version
            </span>
        </div>
        <button class="btn btn-primary w-100 rounded-pill py-3 fw-bold shadow-lg btn-melayang bg-theme"
            onclick="pindahKeLogin()">
            MASUK SISTEM <i class="bi bi-arrow-right-circle ms-1"></i>
        </button>
    </div>
      <div class="text-center mt-4 mb-2 small text-secondary" style="width: 100%;">
          &copy; <span id="yearAppLanding"></span> SiMISTerBIn <span id="footSchoolLanding" class="fw-bold"></span>. Hak Cipta Dilindungi.<br>
          <a href="javascript:void(0)" onclick="$('#mdlPrivacy').modal('show')" class="text-decoration-none text-primary fw-bold" style="font-size: 11px;">Kebijakan Privasi</a> &bull; Powered by: <a href='https://www.farypin-inovasiteknologi.com' rel='dofollow' style='color:blue; font-size: 11px;'>PT Farypin Inovasi Teknologi</a><br>
          <span class="text-muted fw-bold" style="font-size: 10px;">App Version : 3.26.09</span>
      </div>
</div>

<div class="login-card hidden" id="viewLogin">
    <button class="btn btn-sm btn-light border shadow-sm position-absolute" style="top: 15px; left: 15px;"
        onclick="kembaliKeLanding()">
        <i class="bi bi-arrow-left"></i> Kembali
    </button>

    <div class="text-center mb-4 mt-4">
        <img src="./icon.png" style="height: 70px;" class="mb-2">
        <h5 class="text-uppercase fw-bold text-dark mb-0">Silakan Login</h5>
        <span class="text-muted small">Masukkan Username/NISN Anda</span>
    </div>

    <form onsubmit="doLogin(event)">
        <div class="form-floating mb-3">
            <input id="u" class="form-control rounded-pill px-4" placeholder="Username / NISN" required>
            <label class="px-4">Username / NISN</label>
        </div>
        <div class="form-floating mb-1 position-relative">
            <input type="password" id="p" class="form-control rounded-pill px-4" placeholder="Password"
                style="padding-right: 50px;" required>
            <label class="px-4">Password</label>
            <i class="bi bi-eye-slash" onclick="togglePass('p', this)"
                style="position: absolute; right: 20px; top: 50%; transform: translateY(-50%); cursor: pointer; font-size: 1.2rem; z-index: 10; color: #6c757d;"></i>
        </div>

        <div class="text-end mb-3 px-2">
            <a href="javascript:void(0)" class="small text-decoration-none"
                onclick="$('#mdlLupaPass').modal('show')">Lupa Password?</a>
        </div>

        <button type="submit" class="btn btn-primary w-100 rounded-pill py-3 fw-bold shadow-sm bg-theme mb-2">MASUK
            APLIKASI</button>

        <div class="divider-text">LAYANAN PUBLIK</div>

        <button type="button" class="btn w-100 rounded-pill py-2 fw-bold shadow-sm mb-3"
            style="background: linear-gradient(135deg, #f6c23e, #f4a200); color: #fff; border: none;"
            onclick="bukaModalDaftarUlang()">
            <i class="bi bi-person-plus-fill"></i> DAFTAR ULANG MURID BARU
        </button>

        <div class="d-flex gap-2">
            <button type="button" class="btn btn-success w-50 rounded-pill py-2 fw-bold shadow-sm"
                onclick="openScannerPublic()">
                <i class="bi bi-qr-code-scan"></i> SCAN KARTU
            </button>
            <button type="button" class="btn btn-outline-primary w-50 rounded-pill py-2 fw-bold shadow-sm bg-white"
                onclick="cariDataAlumni()">
                <i class="bi bi-search"></i> CEK ALUMNI
            </button>
        </div>

    </form>
</div>
